<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUN_NAME walkthrough</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #f5f6f8;
  --text: #1a1d21;
  --muted: #5b6370;
  --border: #d5d9e0;
  --accent: #2557d6;
  --pass-bg: #dff5e4;
  --pass-text: #14532d;
  --fail-bg: #fde2e2;
  --fail-text: #7f1d1d;
  --blocked-bg: #fdf0cf;
  --blocked-text: #6b4a05;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418;
    --surface: #1b1e24;
    --text: #e8eaee;
    --muted: #9aa3b2;
    --border: #343a45;
    --accent: #7ba3ff;
    --pass-bg: #163a22;
    --pass-text: #a7f0bb;
    --fail-bg: #4a1818;
    --fail-text: #ffb4b4;
    --blocked-bg: #4a3a12;
    --blocked-text: #f6dc93;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main {
  max-width: 980px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 8px; }
h2 { font-size: 1.25rem; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.lede { margin: 0 0 4px; }
.meta { margin: 0; color: var(--muted); font-size: 0.9rem; }
ul, ol { padding-left: 1.4rem; }
li { margin: 0 0 16px; }
li > p { margin: 0 0 6px; }
.look { color: var(--muted); }
.verdict {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  vertical-align: middle;
}
.verdict.pass { background: var(--pass-bg); color: var(--pass-text); }
.verdict.fail { background: var(--fail-bg); color: var(--fail-text); }
.verdict.blocked { background: var(--blocked-bg); color: var(--blocked-text); }
.shots {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin: 10px 0 0;
}
figure { margin: 0; min-width: 0; }
figure img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
}
figcaption { margin-top: 4px; color: var(--muted); font-size: 0.85rem; }
code, pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.9em;
}
code { background: var(--surface); border-radius: 4px; padding: 1px 5px; }
pre { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
</style>
</head>
<body>
<main>
<header>
<h1>RUN_NAME</h1>
<p class="lede">ONE_LINE_OF_WHAT_CHANGED</p>
<p class="meta">DATE · branch <code>BRANCH_NAME</code></p>
</header>

<section>
<h2>What changed</h2>
<ul>
<li>BEHAVIOUR_BULLET_1</li>
<li>BEHAVIOUR_BULLET_2</li>
<li>BEHAVIOUR_BULLET_3</li>
</ul>
</section>

<section>
<h2>Try it</h2>
<ol>
<li>
<p>STEP_TEXT <span class="verdict pass">PASS</span></p>
<p class="look">Look for: LOOK_FOR_TEXT</p>
<div class="shots">
<figure>
{{SHOT:qa/NN-folder/NN-step-light|ALT_TEXT_OF_TWENTY_PLUS_CHARACTERS_SAYING_WHAT_TO_NOTICE}}
<figcaption>Light</figcaption>
</figure>
<figure>
{{SHOT:qa/NN-folder/NN-step-dark|ALT_TEXT_OF_TWENTY_PLUS_CHARACTERS_SAYING_WHAT_TO_NOTICE}}
<figcaption>Dark</figcaption>
</figure>
</div>
</li>
</ol>
</section>

<section>
<h2>Files worth reading</h2>
<ul>
<li><code>path/to/file</code> WHY_THIS_FILE_MATTERS</li>
</ul>
</section>

<section>
<h2>Not covered</h2>
<ul>
<li>NOT_COVERED_ITEM</li>
</ul>
</section>
</main>
</body>
</html>
