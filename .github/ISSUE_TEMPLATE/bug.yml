name: Bug report
description: Report a problem with a skill, a rule or an install script
labels:
  - bug
body:
  - type: input
    id: component
    attributes:
      label: Skill, rule or script
      placeholder: e.g. skill orchestrate, rule safety, install.sh
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Antigravity
        - none (a script run on its own)
        - other
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      placeholder: e.g. Claude Code 2.1.278
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 15.1, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: countersign-skills version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
